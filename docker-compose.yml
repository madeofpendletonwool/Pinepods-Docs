services:
  pinepods-docs:
    build: .
    ports:
      - "8080:80"
    volumes:
      # Download Center files live here, NOT in git.
      # Drop apks / desktop builds / etc. into ./downloads-data on the host and
      # they become available at https://pinepods.online/downloads/<filename>.
      # Then add a matching entry to the `downloads` array in
      # src/pages/download.js so it shows up on the /download page.
      - ./downloads-data:/usr/share/nginx/html/downloads:ro
    restart: unless-stopped
