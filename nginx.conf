server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Issue relative redirects so the trailing-slash redirect keeps the
    # browser's host:port (e.g. localhost:8080) instead of forcing the
    # container's internal :80.
    absolute_redirect off;

    # Uploaded download files (APKs, desktop builds, etc.) come from the
    # mounted ./downloads-data volume — see docker-compose.yml. They are
    # served at /downloads/<filename> and forced to download rather than
    # render in the browser.
    location /downloads/ {
        types {
            application/vnd.android.package-archive  apk;
        }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        autoindex off;
    }

    # Docusaurus generates real .html files (e.g. /download/index.html),
    # so fall through directory -> .html -> 404 page.
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    error_page 404 /404.html;
}
